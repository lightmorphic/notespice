# One-time backfill: creates the GitHub releases (and their tags) for
# every version that shipped without one — 1.3.1 through the current
# head. Each release matches the project's hand-made format: tag =
# bare version, title "X.Y.Z — YYYY-MM-DD" from the CHANGELOG.md
# heading, body = that version's changelog section verbatim.
#
# Idempotent: versions that already have a release are skipped, so
# re-running is harmless. Safe to delete once the backfill has run.
#
# Older commits carried several versions in one push, so 1.3.4 and
# 1.3.6 are tagged at the commit that first contained their changes
# (the same commits as 1.3.5 and 1.3.7 respectively).
name: Backfill releases

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Create missing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          create_one() {
            v="$1"; target="$2"
            if gh release view "$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "$v: release already exists, skipping"
              return 0
            fi
            TAG="$v" python3 - <<'PYEOF'
          import os, re
          tag = os.environ["TAG"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(
              rf"^## {re.escape(tag)} — (\S+)\n(.*?)(?=^## |\Z)",
              text, re.M | re.S)
          if not m:
              raise SystemExit(f"No CHANGELOG.md section found for {tag}")
          open("release-title.txt", "w", encoding="utf-8").write(f"{tag} — {m.group(1)}")
          open("release-body.md", "w", encoding="utf-8").write(m.group(2).strip() + "\n")
          PYEOF
            gh release create "$v" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$target" \
              --title "$(cat release-title.txt)" \
              --notes-file release-body.md
            echo "$v: created"
          }

          create_one 1.3.1  9021074e18de518c6fb941ba40ba82c9dbe6bf67
          create_one 1.3.2  2b91c085c6385c2f490a2d48f9bb8b81fea485d3
          create_one 1.3.3  c195e7ad3cb6f8a3f6cd596078294dd35d67345c
          create_one 1.3.4  ceadef9e3314be1ff4fe57dce2dd067ad512d837
          create_one 1.3.5  ceadef9e3314be1ff4fe57dce2dd067ad512d837
          create_one 1.3.6  a55d996badb28896c0773e68484bb987a7b492cc
          create_one 1.3.7  a55d996badb28896c0773e68484bb987a7b492cc
          create_one 1.3.8  f7ded9424388deca2ce9e35868feb8e9507d2c79
          create_one 1.3.9  25892c52f088d43bba756422f85f547f0460bb3c
          create_one 1.3.10 d6bc7376616275386683b2b6cd457c9ee8e2c8ee
          create_one 1.4.0  4a431cc87a05e2c274ba3466c1f979134483a6a9
          create_one 1.5.0  c1fc7d9a9517d47ad0f735974a7726ea7951eea8
          create_one 1.5.1  1c57cf5ee0153400e9def7bd13f4cd9cb2ed2983
          create_one 1.5.2  8c3c230a248967f63926a31db5b447465ddf0798
          # Newest last, resolved at run time, so it gets the
          # "Latest" badge (most recently created release).
          create_one 1.5.3  main
